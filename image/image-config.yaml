# ParallelCluster image build config, rendered by build-image.sh.
# @@...@@ placeholders are filled from the Pulumi stack outputs.
Build:
  InstanceType: g4dn.xlarge
  ParentImage: @@PARENT_AMI@@
  SubnetId: @@SUBNET@@
  SecurityGroupIds:
    - @@SECURITYGROUP@@
  UpdateOsPackages:
    Enabled: true
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  Components:
    - Type: script
      Value: s3://@@BUCKETNAME@@/image/install-image.sh
  Imds:
    ImdsSupport: v2.0
