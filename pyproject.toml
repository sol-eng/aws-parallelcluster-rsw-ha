[project]
name = "aws-parallelcluster-rsw-ha"
version = "0.1.0"
requires-python = ">=3.12.11"
dependencies = [
    # ParallelCluster CLI; all transitive dependencies are pinned in uv.lock
    "aws-parallelcluster==3.16.1",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot/GHSA advisories),
# so a relock can never resolve back to a vulnerable version
constraint-dependencies = [
    "certifi>=2026.10.19",
    "flask>=3.1.3",
    "idna>=3.15",
    "marshmallow>=3.26.2",
    "requests>=2.33.0",
    "setuptools>=84.1.0",
    "urllib3>=2.7.0",
    "werkzeug>=3.1.6",
]
