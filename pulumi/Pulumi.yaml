name: rsw-ha
runtime:
  name: python
  options:
    virtualenv: .venv
    toolchain: uv
description: Auxiliary infrastructure for Posit Workbench on AWS ParallelCluster

config:
  region:
    type: string
    description: AWS region to use
    default: eu-west-1 
  ServerInstanceType:
    type: string
    description: AWS instance type for AD jumphost EC2 instance 
    default: t3.medium

  domain_name:
    type: string
    description: Name of Domain to be used for AD 
    default: pwb.posit.co
  rsw_db_username:
    type: string
    description: Username for the PostgreSQL db
    default: pwb_db_admin 
  slurm_db_username:
    type: string
    description: Username for the MySQL db
    default: slurm_db_admin 
  email:
    type: string
    description: Owner e-mail, used for tagging and the EC2 key pair name (required)
  billing_code:
    type: string
    description: Billing code, used for the rs:subsystem tag (required)
  dns_zone:
    type: string
    description: Existing Route53 hosted zone, e.g. example.com (required)
  dns_subdomain:
    type: string
    description: Optional label between stack name and zone, records become <stack>.<dns_subdomain>.<dns_zone>
    default: ""
  acm_domain:
    type: string
    description: Domain of an ISSUED ACM certificate for the ALBs, defaults to *.<dns_subdomain>.<dns_zone>
    default: ""
  vpc_name_tag:
    type: string
    description: Name tag of the existing VPC to deploy into
    default: shared
  jumphost_instance_profile:
    type: string
    description: Optional IAM instance profile for the AD jump host (e.g. for SSM access)
    default: ""
  jumphost_ubuntu:
    type: string
    description: Ubuntu release for the AD jump host (focal, jammy or noble). Changing it replaces the jump host.
    default: noble

