[project]
name = "parallelcluster-pulumi"
version = "0.1.0"
requires-python = ">=3.12.11"
# Direct dependencies only; all transitive dependencies are pinned in uv.lock
dependencies = [
    "jinja2==3.1.6",
    "pulumi==3.269.0",
    # stay on 6.x: 7.x is a major upgrade with resource/state changes
    "pulumi-aws==6.83.4",
    "pulumi-command==1.2.1",
    "pulumi-random==4.21.4",
    "pulumi-tls==5.6.2",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot/GHSA advisories),
# so a relock can never resolve back to a vulnerable version
constraint-dependencies = [
    "idna>=3.15",
    "protobuf>=5.29.6",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "urllib3>=2.7.0",
    "wheel>=0.46.2",
]
