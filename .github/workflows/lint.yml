on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main

name: Lint

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (errors only)
        # pulumi/server-side-files/config/useradd.sh is a Jinja template, not plain shell
        run: shellcheck -S error image/*.sh parallelcluster/*.sh parallelcluster/scripts/*.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check --select F pulumi/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render docs
