on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "pulumi/pyproject.toml"
      - "pulumi/uv.lock"
      - "pulumi/requirements.txt"
      - ".github/workflows/deps-sync.yml"

name: Dependency sync

# uv.lock is the source of truth; requirements.txt is generated from it.
# Dependabot edits requirements.txt independently of the lock, so its PRs are
# fixed up in place. Any other PR fails if the two are out of sync.
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      FIX: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Sync requirements.txt with uv.lock
        run: |
          base="origin/$GITHUB_BASE_REF"
          audit=false
          for dir in . pulumi; do
            # A Dependabot security update that bumps only requirements.txt is
            # reverted by the re-export; let "Security floors" fix it in uv.lock
            if git diff --quiet "$base...HEAD" -- "$dir/uv.lock" \
                && ! git diff --quiet "$base...HEAD" -- "$dir/requirements.txt"; then
              audit=true
            fi
            (cd "$dir" && uv lock --check && uv export --frozen --no-hashes -o requirements.txt >/dev/null)
          done
          if [ "$FIX" = true ] && [ "$audit" = true ]; then
            gh workflow run deps-security.yml
          fi
          git diff --quiet && exit 0
          if [ "$FIX" != true ]; then
            git diff
            echo "::error::requirements.txt is out of sync with uv.lock; run 'uv export --no-hashes -o requirements.txt' in the affected project"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Sync requirements.txt with uv.lock"
          git push
          # pushes made with GITHUB_TOKEN don't trigger workflows
          gh workflow run lint.yml --ref "$GITHUB_HEAD_REF"
